<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Porte Magique</title>
    <style>
        body {
            margin: 0;
            padding: 0px;
            background-image: url('fond.webp'); 
            background-size: cover;           
            background-position: center;     
            background-repeat: no-repeat;     
            display: flex;
            justify-content: center;
            align-items: center;              
            height: 100vh;
            overflow: hidden;
        }
        
        #piano-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 400px; /* Ajusté selon ta demande */
        }

        .circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(119, 119, 119, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .circle:hover {
            background-color: rgba(255, 141, 18, 0.4);
        }

        .circle:active {
            background-color: #fff;
            color: rgba(170, 131, 55, 0.4);
        }
    </style>
</head>
<body>
    <div id="piano-container">
        <div class="circle" data-note="do"></div>
        <div class="circle" data-note="re"></div>
        <div class="circle" data-note="mi"></div>
        <div class="circle" data-note="fa"></div>
        <div class="circle" data-note="sol"></div>
        <div class="circle" data-note="la"></div>
        <div class="circle" data-note="si"></div>
        <div class="circle" data-note="do2"></div>
        <div class="circle" data-note="re2"></div>
        <div class="circle" data-note="mi2"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
